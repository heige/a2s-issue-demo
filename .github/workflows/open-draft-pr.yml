name: Open A2S draft PR

on:
  push:
    branches:
      - "a2s/**"

permissions:
  contents: read
  issues: read
  pull-requests: write

concurrency:
  group: open-draft-pr-${{ github.ref }}
  cancel-in-progress: false

jobs:
  open:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Open one draft pull request for the action branch
        env:
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          rest="${HEAD_BRANCH#a2s/issue-}"
          issue_number="${rest%%-*}"
          action_suffix="${rest#*-}"
          case "$issue_number" in
            ""|*[!0-9]*)
              echo "unexpected A2S branch name: $HEAD_BRANCH" >&2
              exit 1
              ;;
          esac
          if [ "$action_suffix" = "$rest" ] || [ -z "$action_suffix" ]; then
            echo "missing action suffix in branch name: $HEAD_BRANCH" >&2
            exit 1
          fi

          existing="$(gh pr list --repo "$GH_REPO" --head "$HEAD_BRANCH" --state all --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            echo "pull request #$existing already exists"
            exit 0
          fi

          issue_title="$(gh api "repos/$GH_REPO/issues/$issue_number" --jq .title)"

          gh pr create \
            --repo "$GH_REPO" \
            --draft \
            --base "$BASE_BRANCH" \
            --head "$HEAD_BRANCH" \
            --title "A2S: $issue_title" \
            --body "Automated draft for #$issue_number.

Head commit: \`$HEAD_SHA\`

The A-Space action produced this branch. CI and human review remain required."
